---
if: person_answering == 'attorney'
id: attorney workflow choice
question: How would the attorney like to complete the interview?
fields:
  - no label: attorney_workflow
    input type: radio
    default: fast
    choices:
      - Single-page worksheet (fast path): fast
      - Guided interview: guided
---
sets: attorney_answer_variables
code: |
  show_instructions = False
  nav.set_section('review_about_you')
  # Keep the tenant workflow's eligibility and procedural warnings.
  case.status
  if case.status == 'onlyntq':
    onlyhasntq
  if case.status in ('afj', 'late'):
    firstdatepassed
  if case.status in ('need-emergency-repair', 'self-help-eviction'):
    redirect_to_uptocode
  attorney_intake_complete
  prepared_with_aoc
  common_answer_variables
  attorney_answer_variables = True
---
sets: attorney_worksheet_ready
code: |
  nav.hide()
  # Initialize field objects and choice lists in this small block. Otherwise
  # each missing object retries the large question and repeats its full source
  # in the Playground debug panel, stalling client-side initialization.
  need(
    macourts, occupancy_ordinance_by_city, case, tenants_attorney, tenant, landlord,
    landlords_attorney, additional_tenants, premises_alternate_address, facts,
    discrimination, discrimination.sexual_harassment, retaliation, initial_defense,
    security_deposit, postforeclosure, postforeclosure.no_just_cause,
    postforeclosure.notice_provisions, disability, bqe, consumer_protection,
    claims, relief, other, bad_conditions, fault, last_months_rent, subsidized_housing,
  )
  # Snapshot optional saved answers once rather than seeking them in field templates.
  attorney_saved_checkbox_answers = {
    name: showifdef(name, None) for name in (
      'fault_basis', 'nofault_basis', 'summons_eviction_reasons',
      'post_ntq_waiver', 'condo_violations', 'condo_local_violations',
      'bad_conditions.conditions', 'bad_conditions.landlord_notified',
      'discrimination.protected_classes', 'security_deposit.violations',
    )
  }
  attorney_saved_none = {
    name: checkbox_none_selected(saved) for name, saved in attorney_saved_checkbox_answers.items()
  }
  attorney_saved_none['condo_local_violations'] = checkbox_none_selected(
    attorney_saved_checkbox_answers['condo_local_violations'],
    ['My landlord failed to obtain the proper local permit.', 'My landlord violated another local rule (see links in help).'],
  )
  attorney_saved_condo = attorney_saved_checkbox_answers['condo_local_violations']
  attorney_boston_condo_defaults = {
    'notice': attorney_saved_condo.get("My landlord failed to provide me with 5 years' notice and someone with a disability or an elder is part of my household.", False) if attorney_saved_condo is not None else False,
    'just_cause': attorney_saved_condo.get("My landlord did not give me 'just cause' for my eviction (they gave no reason or a bad reason).", False) if attorney_saved_condo is not None else False,
  }
  attorney_worksheet_ready = True
---
if: person_answering == 'attorney' and attorney_workflow == 'fast'
id: attorney worksheet
question: |
  Attorney Worksheet
subquestion: |
  <nav id="worksheet-menu" aria-label="On this page" class="worksheet-menu" tabindex="-1">
  <strong>Sections:</strong>
  <ul>
  <li><a href="#worksheet-representation">Attorney</a></li>
  <li><a href="#worksheet-tenant">Tenant</a></li>
  <li><a href="#worksheet-landlord">Landlord</a></li>
  <li><a href="#worksheet-case">Court case</a></li>
  <li><a href="#worksheet-tenancy">Tenancy</a></li>
  <li><a href="#worksheet-notices">Notices and tenancy defenses</a></li>
  <li><a href="#worksheet-claims">Claims and defenses</a></li>
  <li><a href="#worksheet-relief">Relief and finish</a></li>
  </ul>
  </nav>

  Navigate sections without leaving the page and **Continue** saves the whole worksheet.
fields:
  - note: |
      <h2 id="worksheet-representation" class="worksheet-heading" tabindex="-1">Attorney Representation</h2>

      [Back to sections](#worksheet-menu)
      [NEWLINE]
  - Representation: representation_type
    input type: radio
    choices:
      - Entering an appearance: entering_appearance
      - Ghostwriting: ghostwriting
  - Tenant attorney first name: tenants_attorney.name.first
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney middle name: tenants_attorney.name.middle
    required: false
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney last name: tenants_attorney.name.last
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney name suffix: tenants_attorney.name.suffix
    required: false
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney BBO number: tenants_attorney.bbo
    required: false
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney email address: tenants_attorney.email
    required: false
    js show if: |-
      (val("representation_type") === "entering_appearance")
    datatype: email
  - Tenant attorney phone number: tenants_attorney.phone_number
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney fax number: tenants_attorney.fax_number
    required: false
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney office name (type or select from list): tenants_attorney.office
    input type: combobox
    choices:
      - Community Legal Aid
      - De Novo Center for Justice and Healing
      - Disability Law Center
      - Greater Boston Legal Services
      - Massachusetts Law Reform Institute
      - MetroWest Legal Services
      - National Consumer Law Center
      - Northeast Legal Aid
      - South Coastal Counties Legal Services
      - Volunteer Lawyers Project
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney street address: tenants_attorney.address.address
    address autocomplete: true
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney suite or unit: tenants_attorney.address.unit
    required: false
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney city: tenants_attorney.address.city
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney state: tenants_attorney.address.state
    code: |
      states_list()
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - Tenant attorney ZIP code: tenants_attorney.address.zip
    js show if: |-
      (val("representation_type") === "entering_appearance")
  - note: |
      <h2 id="worksheet-tenant" class="worksheet-heading" tabindex="-1">Tenant</h2>

      [Back to sections](#worksheet-menu)
      [NEWLINE]
  - Tenant first name: tenant.name.first
  - Tenant middle name: tenant.name.middle
    required: false
  - Tenant last name: tenant.name.last
  - Tenant name suffix: tenant.name.suffix
    required: false
    code: |
      name_suffix()
  - Tenant current street address: tenant.address.address
    address autocomplete: true
  - Tenant current unit: tenant.address.unit
    required: false
  - Tenant current city: tenant.address.city
  - Tenant current state: tenant.address.state
    code: |
      states_list()
    default: MA
  - Tenant current ZIP code: tenant.address.zip
  - Tenant current county: tenant.address.county
    required: false
  - Tenant phone number: tenant.phone_number
    datatype: al_international_phone
    required: false
  - Tenant email address: tenant.email
    datatype: email
    required: false
  - Eviction premises match current address: facts.tenant_address_is_eviction_address
    datatype: yesnoradio
    default: true
  - Eviction street address: premises_alternate_address.address
    address autocomplete: true
    js show if: |-
      ((val("facts.tenant_address_is_eviction_address") === false))
  - Eviction unit: premises_alternate_address.unit
    required: false
    js show if: |-
      ((val("facts.tenant_address_is_eviction_address") === false))
  - Eviction city: premises_alternate_address.city
    js show if: |-
      ((val("facts.tenant_address_is_eviction_address") === false))
  - Eviction state: premises_alternate_address.state
    code: |
      states_list()
    default: MA
    js show if: |-
      ((val("facts.tenant_address_is_eviction_address") === false))
  - Eviction ZIP code: premises_alternate_address.zip
    js show if: |-
      ((val("facts.tenant_address_is_eviction_address") === false))
  - Additional tenants will sign: additional_tenants.there_are_any
    datatype: yesnoradio
  - Defendant names differ on summons: tenant.name_different_on_summons
    datatype: yesnoradio
    default: false
  - Additional names on summons: tenant.more_names_on_summons
    datatype: yesno
    js show if: |-
      (val("tenant.name_different_on_summons"))
  - Tenant name misspelled: tenant.name_misspelled
    datatype: yesno
    js show if: |-
      (val("tenant.name_different_on_summons"))
  - Tenant omitted from summons: tenant.not_named_on_summons
    datatype: yesno
    js show if: |-
      (val("tenant.name_different_on_summons"))
  - Defendants as listed on summons: defendant_name_as_listed_on_summons
    js show if: |-
      (val("tenant.name_different_on_summons"))
  - Request intervention: request_right_to_intervene
    datatype: yesnoradio
    js show if: |-
      (val("tenant.name_different_on_summons") && val("tenant.not_named_on_summons"))
  - Grounds for intervention: intervention_reason
    datatype: area
    js show if: |-
      (val("tenant.name_different_on_summons") && val("tenant.not_named_on_summons")) && (val("request_right_to_intervene"))
  - Harm if intervention denied: intervention_harm
    datatype: area
    js show if: |-
      (val("tenant.name_different_on_summons") && val("tenant.not_named_on_summons")) && (val("request_right_to_intervene"))
  - note: Copies, reminders, and surveys use the tenant contact information above.
  - Email or text the tenant a copy of the completed forms: email_after_completion
    datatype: yesno
    default: true
  - Remind the tenant about deadlines: remind_user
    datatype: yesno
    default: true
  - Send the tenant a survey after the first court date: survey_user
    datatype: yesno
    default: true
  - note: |
      <h2 id="worksheet-landlord" class="worksheet-heading" tabindex="-1">Landlord</h2>

      [Back to sections](#worksheet-menu)
  - note: '### Plaintiff and counsel'
  - Plaintiff name: landlord.name.text
  - Plaintiff type: landlord.organization_type
    datatype: radio
    choices:
      - Corporation, LLC, or company: corporate
      - Housing authority or government agency: public
      - Owner occupies building: livesinbuilding
      - Trust: trust
      - Individual or other: other
  - Ownership changed during tenancy: landlord.is_new
    datatype: yesno
    default: false
  - Reason for ownership change: new_landlord_reason
    choices:
      - Landlord died: My landlord died
      - Landlord sold the building: My landlord sold the building
      - Unknown owner, but new management: I don't know who owns the building now but there is new management
    js show if: |-
      (val("landlord.is_new"))
  - Property sold after notice to quit: building_sold_after_ntq
    datatype: yesno
    js show if: |-
      (val("landlord.is_new")) && ((val("new_landlord_reason") === "My landlord sold the building"))
  - Plaintiff street address: landlord.address.address
    address autocomplete: true
  - Plaintiff suite or unit: landlord.address.unit
    required: false
  - Plaintiff city: landlord.address.city
  - Plaintiff state: landlord.address.state
    default: MA
  - Plaintiff ZIP code: landlord.address.zip
  - Plaintiff has counsel: landlord.has_attorney
    datatype: yesnoradio
    default: false
  - Plaintiff attorney name: landlords_attorney.name.text
    js show if: |-
      (val("landlord.has_attorney"))
  - Plaintiff attorney street address: landlords_attorney.address.address
    required: false
    js show if: |-
      (val("landlord.has_attorney"))
  - Plaintiff attorney suite or unit: landlords_attorney.address.unit
    required: false
    js show if: |-
      (val("landlord.has_attorney"))
  - Plaintiff attorney city: landlords_attorney.address.city
    required: false
    js show if: |-
      (val("landlord.has_attorney"))
  - Plaintiff attorney state: landlords_attorney.address.state
    required: false
    js show if: |-
      (val("landlord.has_attorney"))
  - Plaintiff attorney ZIP code: landlords_attorney.address.zip
    required: false
    js show if: |-
      (val("landlord.has_attorney"))
  - note: |
      <h2 id="worksheet-case" class="worksheet-heading" tabindex="-1">Court case</h2>

      [Back to sections](#worksheet-menu)
      [NEWLINE]
  - LegalServer case number (GBLS clinics only): ls_case_id
    required: false
    help: The internal GBLS case number, such as 26-123456.
  - Court name: court
    datatype: object
    choices: macourts
    help: Select the court where the case is currently pending.
  - Entry date: case.entry_date
    datatype: date
  - First-tier event date assigned: case.hearing_date_assigned
    datatype: yesnoradio
  - First-tier event date: case.first_event
    datatype: date
    js show if: |-
      (val("case.hearing_date_assigned"))
  - Request transfer from District Court to Housing Court: transfer_to_housing_court
    datatype: yesnoradio
    js show if: |-
      val("court") && !${ json.dumps([x.instanceName for x in macourts if "housing court" in x.name.lower()]) }.includes(val("court"))
  - Receiving Housing Court: transfer_court_name_temp
    datatype: object
    choices: "[x for x in macourts if \"housing court\" in x.name.lower()]  \n"
    js show if: |-
      val("court") && !${ json.dumps([x.instanceName for x in macourts if "housing court" in x.name.lower()]) }.includes(val("court")) && val("transfer_to_housing_court")
    help: Select the Housing Court to receive the case.
  - Include motion to file late Answer and discovery: include_late_answer_motion
    datatype: yesno
    default: false
    help: The shared date checks will also review whether a late Answer motion is needed.
  - Grounds stated by landlord: eviction_all_reasons
    datatype: checkboxes
    none of the above: false
    choices:
      - Nonpayment: nonpayment
      - Fault: fault
      - No fault: nofault
      - No notice to quit received: nontq
      - Unknown: unsure
  - Fault allegations: fault_basis
    datatype: checkboxes
    css class: ${ "worksheet-saved-none" if attorney_saved_none["fault_basis"] else "" }
    choices:
      - Chronic late payment of rent: chronic late payment of rent
      - Overcrowding: overcrowding
      - Unauthorized occupants: unauthorized occupants
      - Excessive foot traffic: excessive foot traffic
      - Clutter or hoarding: clutter or hoarding
      - Destruction of property: destruction of property
      - Assault on staff or other tenant: assault on staff or other tenant
      - Harassment of staff or other tenant: harassment of staff or other tenant
      - Disturbance of other tenants (like smoking, noise, or odor) coming from the tenant's apartment: disturbance of other tenants
      - Arrest or conviction for a crime: arrest or criminal conviction
      - Disturbing health and safety of tenants or others: health and safety
      - Other lease violation: other lease violation
    js show if: |-
      (val("eviction_all_reasons['fault']"))
  - No-fault grounds: nofault_basis
    datatype: checkboxes
    css class: ${ "worksheet-saved-none" if attorney_saved_none["nofault_basis"] else "" }
    choices:
      - The tenant refused to pay a higher rent: refusal of rent increase
      - They want to sell the building: desire to sell
      - They want to renovate: desire to renovate
      - They want the apartment for a family member: moving in a family member
      - Landlord did not give a reason: no reason
      - Other: other
    js show if: |-
      ((!val("eviction_all_reasons['fault']") && !val("eviction_all_reasons['nonpayment']") && val("eviction_all_reasons['nofault']")))
  - Rent unpaid pending RAFT or other rental assistance: delay_in_raft
    datatype: yesnoradio
    js show if: |-
      (((val("eviction_all_reasons['fault']") ? "fault" : val("eviction_all_reasons['nonpayment']") ? "nonpayment" : val("eviction_all_reasons['nofault']") ? "nofault" : val("eviction_all_reasons['nontq']") ? "nontq" : "unsure") === "nonpayment"))
  - Required accompanying form received with nonpayment notice: tenant_got_accompanying_form
    datatype: yesnomaybe
    js show if: |-
      (((val("eviction_all_reasons['fault']") ? "fault" : val("eviction_all_reasons['nonpayment']") ? "nonpayment" : val("eviction_all_reasons['nofault']") ? "nofault" : val("eviction_all_reasons['nontq']") ? "nontq" : "unsure") === "nonpayment"))
  - Landlord refused or is expected to refuse rental assistance: discrimination.raft_refusal
    datatype: yesnoradio
    js show if: |-
      (((val("eviction_all_reasons['fault']") ? "fault" : val("eviction_all_reasons['nonpayment']") ? "nonpayment" : val("eviction_all_reasons['nofault']") ? "nofault" : val("eviction_all_reasons['nontq']") ? "nontq" : "unsure") === "nonpayment")) && (val("delay_in_raft"))
  - note: |
      <h2 id="worksheet-tenancy" class="worksheet-heading" tabindex="-1">Tenancy</h2>

      [Back to sections](#worksheet-menu)
      [NEWLINE]
  - Subsidized tenancy: facts.tenant_has_subsidy
    datatype: yesno
    help: Include public housing, portable vouchers, and privately owned subsidized housing.
  - Tenant speaks a language other than English: tenant.is_nonnativespeaker
    datatype: yesno
  - Interpreter requested: tenant.needs_interpreter
    datatype: yesno
    js show if: |-
      (val("tenant.is_nonnativespeaker"))
  - Interpreter language: tenant.preferred_language
    datatype: combobox
    default: ${ default_lang }
    choices:
      - Spanish
      - Cantonese
      - Cape Verdean Creole
      - French
      - Haitian Creole
      - Khmer
      - Mandarin
      - Portuguese
      - Vietnamese
    js show if: |-
      (val("tenant.is_nonnativespeaker")) && ((val("tenant.needs_interpreter")))
  - Household member has a disability: tenant.is_disabled
    datatype: yesno
  - Household member under age 6: tenant.is_under6
    datatype: yesno
  - Household member over age 60: tenant.is_over60
    datatype: yesno
  - Tenant is a survivor of domestic violence: tenant.is_dvvictim
    datatype: yesno
  - Subsidy program: subsidy_type
    choices:
      - Section 8 voucher (portable voucher): Section 8 voucher
      - MRVP (Massachusetts Rental Voucher Program): MRVP
      - Public housing (the landlord is a housing authority): public housing
      - HUD housing run by a private landlord: HUD multi-family
      - Tax credit: tax credit
      - Other or unknown: other
    js show if: |-
      (val("facts.tenant_has_subsidy"))
  - Move-in date: facts.tenant_movein
    datatype: date
    required: false
  - Occupancy in exchange for services; no rent: is_pca
    datatype: yesno
  - Tenant rent share: facts.tenant_rent_share
    datatype: currency
    step: 1
    js show if: |-
      ((!val("is_pca")))
  - Rent frequency: facts.tenant_rent_frequency
    choices:
      - Weekly: week
      - Monthly: month
    default: month
    js show if: |-
      ((!val("is_pca")))
  - Contract rent: facts.tenant_contract_rent
    datatype: currency
    required: false
    js show if: |-
      val("facts.tenant_has_subsidy")
  - Tenancy type: tenancy_type
    choices:
      - Lease, including expired lease: lease
      - Tenancy at will, no agreement, or unknown: taw
  - Lease renewal terms: lease_type
    choices:
      - ends and doesn't renew.: fixed_term
      - renews for another term .: self_extending
      - renews month-to-month or week to week.: renews_as_taw
      - Unknown: unknown
    js show if: |-
      (val("tenancy_type") === "lease")
  - Fixed-term lease expiration: lease_end_date
    datatype: date
    js show if: |-
      (val("tenancy_type") === "lease") && ((val("lease_type") === "fixed_term"))
  - Property foreclosed: postforeclosure.is_foreclosed
    datatype: yesno
    js show if: |-
      ((!(val("facts.tenant_has_subsidy") && (val("subsidy_type") === "public housing"))))
  - Tenant was owner before foreclosure: is_pfc_owner
    datatype: yesno
    js show if: |-
      (!(val("facts.tenant_has_subsidy") && val("subsidy_type") === "public housing")) && ((val("postforeclosure.is_foreclosed")))
  - Sexual harassment: claims.harassment
    datatype: yesno
  - Condominium or cooperative conversion: is_condo_conversion
    datatype: yesno
    js show if: |-
      ((!(val("facts.tenant_has_subsidy") && (val("subsidy_type") === "public housing"))))
  - note: |
      <h2 id="worksheet-notices" class="worksheet-heading" tabindex="-1">Notices and tenancy defenses</h2>

      [Back to sections](#worksheet-menu)
  - note: '### Notices and service of summons'
  - Kind of notice to quit: notice_type
    choices:
      - 14 day Notice to Quit: fourteen_day
      - 30 day Notice to Quit: thirty_day
      - 72 hour Notice to Quit: seventy_two_hour
      - Notice "until the end of the next rental period" or similar: rental_period
      - Tenant never got a Notice to Quit: no_ntq
      - Unknown: thirty_day
  - Rent unpaid when 14-day notice received: behind_in_rent
    datatype: yesnoradio
    js show if: |-
      val("notice_type") === "fourteen_day"
    default: true
  - Rent amount in notice was never agreed: refused_rent_increase
    datatype: yesno
    js show if: |-
      val("notice_type") === "fourteen_day"
  - Notice names tenant: ntq_includes_tenant_name
    datatype: yesnoradio
    default: true
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Notice names all lease signatories: ntq_includes_all_tenants
    datatype: yesnoradio
    default: true
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Notice has correct premises address: ntq_includes_correct_address
    datatype: yesnoradio
    default: true
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Lease requires 30-day notice for nonpayment: lease_requires_30_day_notice
    datatype: yesno
    default: false
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Notice omits required language: ntq_leaves_off_required_language
    datatype: yesno
    default: false
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Notice to quit received: date_received_ntq
    datatype: date
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Summons served: date_received_summons
    datatype: date
  - Summons served in hand on tenant or adult household member: summons_in_hand
    datatype: yesno
  - Summons mailed: summons_mailed
    datatype: yesno
  - Summons left at last and usual address: summons_last_and_usual
    datatype: yesno
  - Summons grounds match notice: ntq_matches_summons
    datatype: yesnoradio
    default: true
  - Additional grounds on summons: summons_eviction_reasons
    datatype: checkboxes
    css class: ${ "worksheet-saved-none" if attorney_saved_none["summons_eviction_reasons"] else "" }
    choices:
      - Failure to vacate after a valid notice or notice to quit has expired (or similar): failure_to_vacate
      - Non-payment of rent: rent
      - A different amount of rent than listed on the notice: rent
      - The same "fault" reason listed on the notice to quit: same_fault
      - A new "fault" reason or breach of lease, not listed on the notice to quit: new_fault
    js show if: |-
      ((!val("ntq_matches_summons")))
  - Summons names all adult lease signatories: summons_includes_all_tenants
    datatype: yesnoradio
    default: true
  - Summons has correct premises address: summons_includes_correct_address
    datatype: yesnoradio
    default: true
  - Events after notice to quit: post_ntq_waiver
    datatype: checkboxes
    css class: ${ "worksheet-saved-none" if attorney_saved_none["post_ntq_waiver"] else "" }
    choices:
      - Rent paid after notice: rent
      - New lease signed, excluding subsidy recertification: lease
    js show if: |-
      val("notice_type") !== "no_ntq"
  - Notice reserves acceptance for use and occupancy only: ntq_contains_reservation
    datatype: yesnoradio
    js show if: |-
      val("notice_type") !== "no_ntq" && val("post_ntq_waiver['rent']")
    default: true
  - note: '### Subsidized housing'
    js show if: |-
      val("facts.tenant_has_subsidy")
  - PHA pays a portion of rent: subsidized_housing.pha_pays_rent
    datatype: yesno
    js show if: |-
      ((val("facts.tenant_has_subsidy") && (["Section 8 voucher", "MRVP"].indexOf(val("subsidy_type")) !== -1)))
