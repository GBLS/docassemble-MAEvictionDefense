validation code: |
  # Recompute from the submitted facts, never from pre-submit values.
  undefine(*ATTORNEY_DERIVED_ANSWERS)
  edit_contact_info = False
  if "housing court" in court.name.lower():
    transfer_to_housing_court = False
  if not tenant.is_nonnativespeaker:
    tenant.needs_interpreter = False
  if facts.tenant_has_subsidy and subsidy_type == "public housing":
    postforeclosure.is_foreclosed = False
    is_pfc_owner = False
    is_condo_conversion = False
  # Validation cannot seek calculated variables. Use the submitted city directly.
  attorney_submitted_city = (tenant.address.city if facts.tenant_address_is_eviction_address else premises_alternate_address.city).strip().lower()
  if attorney_submitted_city not in occupancy_ordinance_by_city:
    occupancy_ordinance_applies = False
    occupancy_ordinance_use_as_defense = False
    occupancy_ordinance_use_as_counterclaim = False
  if not showifdef("bad_conditions.landlord_notified['other']", False):
    bad_conditions.other = ""
  if not retaliation.is_retaliated or not showifdef("show_retaliation_other", False):
    retaliation.other = ""
  if not tenant.is_discriminated or not showifdef("discrimination.show_other", False):
    discrimination.other = ""
  # Boston-only answers merge into the tenant workflow's existing dictionary.
  if defined('condo_local_violations'):
    condo_local_violations["My landlord failed to provide me with 5 years' notice and someone with a disability or an elder is part of my household."] = attorney_submitted_city == 'boston' and showifdef('attorney_boston_condo_notice', False)
    condo_local_violations["My landlord did not give me 'just cause' for my eviction (they gave no reason or a bad reason)."] = attorney_submitted_city == 'boston' and showifdef('attorney_boston_condo_just_cause', False)
  nav.unhide()
css: |
  <style>
  .worksheet-menu { border: 1px solid #b8c2cc; border-radius: .3rem; padding: 1rem; }
  .worksheet-menu ul { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; list-style: none; margin: .5rem 0 0; padding: 0; }
  .worksheet-heading, #worksheet-menu { scroll-margin-top: 6rem; }
  .worksheet-heading { margin-top: 1.5rem; border-bottom: 1px solid #b8c2cc; padding-bottom: .4rem; }
  .worksheet-heading:focus { outline: 2px solid currentColor; outline-offset: .2rem; }
  </style>
